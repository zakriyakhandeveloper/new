name: Apply NameVerse author slice (islamic aabad..aamil)

on:
  push:
    paths:
      - '.github/workflows/apply-nv-author-islamic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3

      - name: Fetch authored files bundle
        run: |
          set -e
          ok=0
          for u in "https://litter.catbox.moe/qlllqh.tgz" "https://x0.at/KuAN.tgz"; do
            echo "trying $u"
            if curl -fsSL "$u" -o /tmp/nv.tgz; then
              got=$(sha256sum /tmp/nv.tgz | cut -d' ' -f1)
              echo "sha256=$got"
              if [ "$got" = "36b40d01ec0c39428dbe4b21ad0103de2539127d6857cc45863acc5b155c5216" ]; then ok=1; break; fi
            fi
          done
          test "$ok" = "1"
          mkdir -p /tmp/nv && tar xzf /tmp/nv.tgz -C /tmp/nv
          test -f /tmp/nv/scripts/nameverse_author_islamic.py
          test -f /tmp/nv/upgrading/names_upgraded/islamic/aamil.json
          echo "extracted json files: $(find /tmp/nv -name '*.json' | wc -l)"

      - name: Apply, validate, commit and push
        run: |
          set -e
          cp -r /tmp/nv/upgrading/names_upgraded/islamic/. upgrading/names_upgraded/islamic/
          mkdir -p scripts
          cp /tmp/nv/scripts/nameverse_author_islamic.py scripts/
          git config user.email "actions@github.com"
          git config user.name "NameVerse Bot"
          git add upgrading/names_upgraded/islamic scripts/nameverse_author_islamic.py
          echo "staged: $(git diff --cached --name-only | wc -l)"
          python3 - <<'EOF'
          import json, subprocess, sys
          files = [l for l in subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True).splitlines()
              if l.endswith(".json")]
          bad = 0
          for f in files:
              try:
                  d = json.load(open(f, encoding="utf-8"))
                  assert d.get("success") is True, "no success flag"
                  faq = d["data"]["seo"]["faq"]
                  assert len(faq) >= 15, "faq %d" % len(faq)
                  qs = [q["q"] for q in faq]
                  assert len(set(qs)) == len(qs), "duplicate faq"
              except Exception as e:
                  bad += 1
                  print("BAD", f, repr(e))
          print("validated", len(files), "changed json files; bad =", bad)
          sys.exit(1 if bad else 0)
          EOF
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "NameVerse: re-author islamic names (full slice aabad..aamil, 100 files) with verified Tier-1 data and 15 unique FAQs each; fabricated history/etymology removed"
          git push origin HEAD:names-upgraded-v3
