name: verify-names-v3

on:
  push:
    paths:
      - '.github/workflows/verify-names-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3
          fetch-depth: 1

      - name: Fetch pipeline bundle
        run: |
          set -e
          mkdir -p scripts
          ok=0
          for u in \
            "https://litter.catbox.moe/wluhn0.tgz" \
            "https://x0.at/YnTZ.tgz" \
            "https://temp.sh/cEbLl/names_pipeline.tgz" ; do
            echo "trying $u"
            if curl -fsSL "$u" -o /tmp/bundle.tgz && tar tzf /tmp/bundle.tgz >/dev/null 2>&1; then
              tar xzf /tmp/bundle.tgz -C scripts && ok=1 && break
            fi
          done
          test "$ok" = "1"
          test -f scripts/verify_runner.py
          test -f scripts/verify_names.py
          test -f scripts/verified_lexicon_merged.py
          test -f scripts/cleanup_removed.json

      - name: Run verification pipeline
        run: python3 scripts/verify_runner.py

      - name: Delete duplicate files
        run: |
          python3 - <<'PY'
          import json, os
          root = os.path.join(os.environ["GITHUB_WORKSPACE"], "upgrading", "names_upgraded")
          d = json.load(open("scripts/cleanup_removed.json", encoding="utf-8"))
          n = 0
          for r in d["removed"]:
              p = os.path.join(root, r["religion"], r["file"])
              if os.path.exists(p):
                  os.remove(p); n += 1
          print("deleted", n)
          PY

      - name: Commit and push
        run: |
          git config user.name "NameVerse Bot"
          git config user.email "actions@github.com"
          git add -A upgrading/names_upgraded
          git commit -m "Verify & correct names_upgraded v3: consistent meanings, verified roots, fabrication removed, duplicates deleted" || echo "nothing to commit"
          git push origin HEAD:names-upgraded-v3
