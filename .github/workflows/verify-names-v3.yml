name: verify-names-v3

on:
  push:
    paths:
      - '.github/workflows/verify-names-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3
          fetch-depth: 1

      - name: Fetch pipeline scripts
        run: |
          set -e
          mkdir -p scripts
          B="https://static.teamily.ai/sites/45939e3d-31a7-4b18-9c9e-d393a411d6b7/documents/name_verify"
          curl -fsSL "$B/verified_lexicon_merged.py" -o scripts/verified_lexicon_merged.py
          curl -fsSL "$B/verify_names.py"            -o scripts/verify_names.py
          curl -fsSL "$B/verify_runner.py"           -o scripts/verify_runner.py
          curl -fsSL "$B/cleanup_removed.json"       -o scripts/cleanup_removed.json
          wc -c scripts/*

      - name: Run verification pipeline
        run: python3 scripts/verify_runner.py

      - name: Commit and push
        run: |
          git config user.name "NameVerse Bot"
          git config user.email "actions@github.com"
          git add -A upgrading/names_upgraded
          git commit -m "Verify & correct names_upgraded v3: consistent meanings, verified roots, fabrication removed" || echo "nothing to commit"
          git push origin HEAD:names-upgraded-v3
