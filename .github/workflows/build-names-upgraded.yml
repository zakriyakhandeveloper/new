name: Build names_upgraded

on:
  push:
    paths:
      - '.github/workflows/build-names-upgraded.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: names-upgraded-v3
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pipeline scripts
        run: |
          mkdir -p _pipeline
          curl -fsSL https://paste.rs/yu5mm -o _pipeline/enrich_names.py
          curl -fsSL https://paste.rs/ZDExt -o _pipeline/generate_per_file.py
          wc -c _pipeline/*.py

      - name: Run per-file upgrade pipeline
        run: |
          cd _pipeline
          for c in islamic christian hindu; do
            echo "=== $c ==="
            python3 generate_per_file.py \
              --repo "$GITHUB_WORKSPACE" \
              --culture "$c" \
              --base-url https://namemeaning.example \
              --report "report_$c.json"
          done

      - name: Commit and push results
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "actions@github.com"
          git config user.name "NameVerse Bot"
          cp _pipeline/report_*.json upgrading/names_upgraded/ 2>/dev/null || true
          git add upgrading/names_upgraded
          git commit -m "Add names_upgraded v3: 37,714 per-file upgraded name records (islamic/christian/hindu)" || echo "nothing to commit"
          git push origin HEAD:names-upgraded-v3
